# GitHub Pages compatibility only. Vercel is the primary host (30 Sep 2026)
# and scripts/stamp-build.js is the canonical deployment stamp -- see
# vercel.json. While the Pages site still exists, Jekyll builds it from main,
# and this file keeps its build stamped the same way, so the foot of Admin /
# Manage can say exactly which commit a device is running.
# tests/buildStamp.test.js checks both hosts' wiring.
#
# assets/js/buildInfo.pages.js is a Liquid template rendered to
# assets/js/buildInfo.js with the commit being built. The committed
# assets/js/buildInfo.js is the local placeholder and is excluded, so it can
# never be copied over the stamped one.

# The build date is the club's date, not the build server's (UTC).
timezone: Europe/London

exclude:
  - assets/js/buildInfo.js
  # Vercel's build settings and stamping script (scripts/stamp-build.js) do the
  # same job there that this file does here; Pages has no use for the config.
  - vercel.json
